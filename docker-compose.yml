services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' localhost:27017/test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: prd_creativeai
      CORS_ORIGINS: http://localhost:3000
      GROQ_API_KEY: ""
      NINEROUTER_BASE_URL: http://host.docker.internal:20128/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8001
    restart: unless-stopped
    environment:
      PORT: "80"
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo_data:
